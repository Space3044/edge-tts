name = "tts-voice-magic"
main = "index.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "tts-voice-magic"

[env.staging]
name = "tts-voice-magic-staging"

# 变量配置（如果需要的话）
[vars]
# 可以在这里添加环境变量

# 如果需要 KV 存储（可选）
# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# D1：加密保存各家转录服务的 endpoint / model / API Key。
# 本地 wrangler dev --local 可以直接用这个占位 id；
# 远端部署前执行 npx wrangler d1 create voicecraft，把返回的 database_id 填到这里。
[[d1_databases]]
binding = "DB"
database_name = "voicecraft"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 非默认环境不会继承上面的 binding，每个 env 都要重新声明。
[[env.production.d1_databases]]
binding = "DB"
database_name = "voicecraft"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "voicecraft-staging"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# 路由配置
#
# 每天 UTC 03:17 探测一次所有 Trancy 账号：调 /1/user/profile 拿回新 token。
# Trancy 的 JWT 没有 exp，靠这次调用续命；一天一次足够。改时间记得同步 README。
[triggers]
crons = ["17 3 * * *"]

# 非默认环境同样不继承 triggers；线上要跑定时续期就得在这里再声明一份。
[env.production.triggers]
crons = ["17 3 * * *"]

